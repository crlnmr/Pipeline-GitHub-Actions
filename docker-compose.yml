services:
  db:
    image: postgres:15
    container_name: e-micro-commerce-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: e-micro-commerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d e-micro-commerce"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
