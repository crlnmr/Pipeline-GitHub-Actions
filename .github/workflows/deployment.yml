name: Tests and Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Static, Unit, Integration and E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_VERSION: 22
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/ecommerce_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5433/ecommerce_test
      CLERK_SECRET_KEY: test_clerk_secret_key
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: test_clerk_publishable_key
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: apps/frontend

      - name: Run static analysis
        run: npm run lint

      - name: Run unit and integration tests
        run: npm run test

      - name: Run build
        run: npm run build

      - name: Run E2E tests with Playwright
        run: npm run test:e2e