name: Tests and Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 22
  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/ecommerce_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5433/ecommerce_test
  NEXT_PUBLIC_API_URL: http://localhost:3001/v1
  CLERK_SECRET_KEY: test_clerk_secret_key
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: test_clerk_publishable_key

jobs:
  lint-unit-integration-tests:
    name: Lint, Unit and Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static analysis - Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

  build-and-e2e-tests:
    name: Build and E2E Tests
    runs-on: ubuntu-latest
    needs: lint-unit-integration-tests

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/ecommerce_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5433/ecommerce_test
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
      CLERK_SECRET_KEY: test_clerk_secret_key
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: test_clerk_publishable_key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/frontend

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  deployment-simulation:
    name: Deployment Simulation
    runs-on: ubuntu-latest
    needs: build-and-e2e-tests
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deployment gate
        run: echo "Deployment autorizado após lint, testes unitários, integração, build e E2E."